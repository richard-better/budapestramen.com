    const all = Array.from(document.querySelectorAll("body *"));
    const target = all.find(function (el) {
      return el.textContent && el.textContent.trim() === labels[section];
    });

    if (target) {
      target.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    } else {
      console.log("Section title not found:", labels[section]);
    }
  }, 1500);
});
</script></body></html>
