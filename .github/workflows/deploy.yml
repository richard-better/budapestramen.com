name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
  PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Verify PostHog configuration is available
        run: |
          if [ -z "$PUBLIC_POSTHOG_PROJECT_TOKEN" ]; then
            echo "::error::Set the PUBLIC_POSTHOG_PROJECT_TOKEN repository variable."
            exit 1
          fi
          if [ -z "$PUBLIC_POSTHOG_HOST" ]; then
            echo "::error::Set the PUBLIC_POSTHOG_HOST repository variable."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Verify Cloudflare credentials are configured
        run: bun run --cwd packages/infra deploy:check
      - name: Build and deploy the production Worker
        run: bun run deploy:production
