<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Budapest Ramen · iPad direction</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #242426;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button:active {
        opacity: 0.72;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid #007aff;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      a {
        color: #007aff;
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        display: block;
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .app {
        --blue: #007aff;
        --muted: #64646b;
        position: relative;
        height: 760px;
        min-height: 620px;
        isolation: isolate;
        overflow: hidden;
        background: #ecede7;
        border-radius: 22px;
        color: #242426;
      }
      #map {
        position: absolute;
        inset: 0;
        background: #ecede7 url("assets/ipad-map-preview.jpg") center / cover;
      }
      #map:not(.ready) .maplibregl-canvas {
        opacity: 0;
      }
      .maplibregl-canvas:focus-visible {
        outline: 3px solid #007aff;
        outline-offset: -4px;
      }
      .maplibregl-ctrl-bottom-right {
        bottom: 5px;
        right: 9px;
      }
      .maplibregl-ctrl-attrib {
        background: rgba(255, 255, 255, 0.74) !important;
        font-size: 10px !important;
        border-radius: 8px;
      }
      .maplibregl-ctrl-attrib a {
        color: #45454b;
      }
      .glass {
        background: rgba(249, 249, 250, 0.77);
        backdrop-filter: blur(28px) saturate(1.55);
        -webkit-backdrop-filter: blur(28px) saturate(1.55);
        box-shadow:
          0 8px 32px #1b252317,
          0 1px 5px #1b25231a,
          inset 0 1px 1px #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.85);
      }
      .sidebar {
        position: absolute;
        top: 16px;
        bottom: 28px;
        left: 16px;
        width: 320px;
        border-radius: 26px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 3;
        transition:
          transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1),
          opacity 0.2s;
      }
      .sidebar.closed {
        transform: translateX(-350px);
        opacity: 0;
        pointer-events: none;
      }
      .side-head {
        padding: 15px 18px 0;
        flex-shrink: 0;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title-row h1 {
        font-size: 25px;
        letter-spacing: -0.8px;
        line-height: 1.2;
        margin: 6px 0;
        font-weight: 700;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        color: var(--blue);
        background: transparent;
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: #77777710;
      }
      .subtitle {
        font-size: 14px;
        color: var(--muted);
        margin: 1px 0 17px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 7px;
        background: #76768018;
        border-radius: 12px;
        height: 42px;
        padding: 0 10px;
        color: #797980;
      }
      .search svg {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }
      .search input {
        min-width: 0;
        flex: 1;
        font-size: 16px;
        letter-spacing: -0.3px;
        border: 0;
        outline: 0;
        background: transparent;
        color: #252527;
        height: 100%;
      }
      .search input::placeholder {
        color: #797980;
      }
      .search input::-webkit-search-cancel-button {
        display: none;
      }
      .search:focus-within {
        box-shadow: 0 0 0 2px #007aff88;
      }
      .clear {
        font-size: 16px;
        width: 26px;
        height: 30px;
        display: grid;
        place-items: center;
        background: transparent;
        color: #797980;
      }
      .clear svg {
        width: 16px;
        height: 16px;
      }
      .segments {
        display: flex;
        background: #76768013;
        border-radius: 11px;
        padding: 3px;
        margin-top: 13px;
      }
      .segments button {
        background: transparent;
        color: #424249;
        flex: 1;
        font-weight: 600;
        font-size: 12px;
        min-height: 32px;
        padding: 6px 7px;
        border-radius: 8px;
        white-space: nowrap;
        letter-spacing: -0.15px;
      }
      .segments button[aria-pressed="true"] {
        background: #fff;
        color: #1c1c1e;
        box-shadow:
          0 2px 6px #00000012,
          0 0 1px #00000020;
      }
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 23px 20px 8px;
      }
      .list-head h2 {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.4px;
        margin: 0;
      }
      .count {
        color: #77777e;
        font-size: 13px;
      }
      .list {
        overflow-y: auto;
        overscroll-behavior: contain;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #0002 transparent;
        padding: 0 10px 18px;
      }
      .place {
        position: relative;
        display: flex;
        width: 100%;
        text-align: left;
        gap: 12px;
        align-items: center;
        background: transparent;
        border-radius: 13px;
        padding: 16px 10px;
        color: #28282c;
        min-height: 99px;
      }
      .place:hover {
        background: #fff8;
      }
      .place:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 65px;
        right: 10px;
        height: 0.5px;
        background: #3c3c4323;
      }
      .place:last-child:after {
        display: none;
      }
      .place .place-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #f0e4df;
        color: #bb5841;
        flex-shrink: 0;
      }
      .place-icon svg {
        width: 23px;
        height: 23px;
      }
      .place-body {
        flex: 1;
        min-width: 0;
      }
      .place-name {
        font-weight: 600;
        font-size: 16px;
        letter-spacing: -0.35px;
        line-height: 1.25;
        display: block;
      }
      .place-meta {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-top: 5px;
        line-height: 1.35;
      }
      .place-rating {
        display: flex;
        gap: 5px;
        align-items: center;
        color: #66666e;
        font-size: 12px;
        margin-top: 6px;
      }
      .place-rating b {
        font-weight: 500;
        color: #43434b;
      }
      .place-rating svg {
        width: 11px;
        height: 11px;
        fill: #ed9b24;
        stroke: #ed9b24;
      }
      .chevron {
        width: 12px;
        height: 15px;
        color: #a0a0a5;
      }
      .section-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.45px;
        font-weight: 600;
        color: #77777c;
        margin: 22px 10px 3px;
      }
      .empty {
        padding: 35px 15px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .side-foot {
        font-size: 11px;
        color: #7b7b82;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 20px;
        border-top: 0.5px solid #3c3c4315;
        background: #f5f5f655;
      }
      .side-foot span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .side-foot svg {
        width: 12px;
        height: 12px;
      }
      .side-foot a {
        color: inherit;
      }
      .map-heading {
        position: absolute;
        top: 22px;
        left: 358px;
        right: 88px;
        pointer-events: none;
        color: #54595d;
        display: flex;
        align-items: center;
        gap: 6px;
        text-shadow:
          0 1px 3px #fff,
          0 0 10px #fff;
      }
      .map-heading span {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.2px;
      }
      .map-heading svg {
        width: 16px;
        height: 16px;
      }
      .map-tools {
        position: absolute;
        right: 18px;
        top: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 2;
      }
      .tool-group {
        padding: 3px;
        border-radius: 24px;
      }
      .tool-group .icon-button {
        color: #4c5157;
      }
      .tool-group .icon-button + button {
        position: relative;
      }
      .tool-group .icon-button + button:before {
        content: "";
        position: absolute;
        top: 0;
        left: 9px;
        right: 9px;
        height: 0.5px;
        background: #3c3c4324;
      }
      .icon-button svg {
        width: 22px;
        height: 22px;
      }
      .restore {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 2;
        border-radius: 50%;
        width: 50px;
        height: 50px;
      }
      .restore:not([hidden]) ~ .map-heading {
        left: 86px;
      }
      .map-badge {
        position: absolute;
        bottom: 33px;
        left: calc(50% + 145px);
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 15px;
        border-radius: 24px;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 500;
        color: #55555e;
        z-index: 1;
        pointer-events: none;
      }
      .map-badge svg {
        width: 15px;
        height: 15px;
        color: #bb5841;
      }
      .pin {
        width: 44px;
        height: 44px;
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        overflow: visible;
      }
      .pin-core {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #bd614b;
        color: #fff;
        box-shadow:
          0 1px 5px #5330243a,
          0 0 0 2px #fff;
        position: relative;
        transition: transform 0.2s ease;
      }
      .pin-core svg {
        width: 17px;
        height: 17px;
        stroke-width: 1.9;
      }
      .pin:not(.recommended) .pin-core {
        width: 14px;
        height: 14px;
        background: #b36e5c;
        box-shadow:
          0 1px 3px #53302422,
          0 0 0 2px #fff;
      }
      .pin:not(.recommended) svg {
        display: none;
      }
      .pin:hover .pin-core,
      .pin.selected .pin-core {
        transform: scale(1.18);
        background: var(--blue);
      }
      .pin.selected {
        z-index: 2;
      }
      .pin.selected .pin-core {
        width: 34px;
        height: 34px;
        box-shadow:
          0 3px 8px #15497a30,
          0 0 0 3px #fff;
      }
      .pin.selected svg {
        display: block;
      }
      .pin-label {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffffffe8;
        padding: 4px 8px;
        border-radius: 7px;
        font-size: 11px;
        line-height: 1.2;
        font-weight: 600;
        box-shadow: 0 1px 5px #0001;
        white-space: nowrap;
        color: #724133;
        pointer-events: none;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pin.selected .pin-label {
        color: #007aff;
      }
      .pin:not(.recommended) .pin-label {
        display: none;
      }
      .maplibregl-marker {
        z-index: 0;
      }
      .maplibregl-marker:has(.selected),
      .maplibregl-marker.selected {
        z-index: 2;
      }
      .detail {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
      .detail-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px 0;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 1px;
        min-height: 44px;
        padding: 0 4px;
        color: var(--blue);
        background: transparent;
        font-size: 16px;
      }
      .back svg {
        width: 22px;
        height: 22px;
      }
      .detail-scroll {
        padding: 0 20px 22px;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .detail-name {
        font-size: 28px;
        line-height: 1.06;
        letter-spacing: -0.9px;
        margin: 20px 0 9px;
        font-weight: 700;
      }
      .detail-address {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.45;
        margin: 0;
      }
      .detail-stars {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        margin: 14px 0 21px;
        color: var(--muted);
      }
      .detail-stars svg {
        color: #e49827;
        fill: #e49827;
        width: 13px;
        height: 13px;
      }
      .detail-stars strong {
        color: #414149;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .action {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        background: #e5edf8;
        color: #007aff;
        padding: 12px 6px;
        border-radius: 13px;
        font-size: 13px;
        font-weight: 500;
        min-height: 68px;
      }
      .action.primary {
        background: #007aff;
        color: white;
      }
      .action svg {
        width: 22px;
        height: 22px;
      }
      .detail-section {
        margin-top: 25px;
      }
      .detail-section h3 {
        font-size: 18px;
        letter-spacing: -0.3px;
        margin: 0 0 11px;
      }
      .grouped {
        border-radius: 15px;
        background: #fff9;
        overflow: hidden;
      }
      .info-row {
        padding: 14px;
        font-size: 14px;
        line-height: 1.45;
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .info-row + .info-row {
        border-top: 0.5px solid #3c3c4320;
      }
      .info-row svg {
        color: #7c7c84;
        width: 18px;
        height: 20px;
      }
      .info-row small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 3px;
      }
      .info-row strong {
        font-weight: 500;
      }
      .recommendation {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #ad533d;
        font-size: 13px;
        font-weight: 600;
        margin-top: 15px;
      }
      .recommendation svg {
        width: 15px;
        height: 15px;
      }
      .detail-source {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.45;
        margin-top: 16px;
      }
      .full-guide {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 500;
        padding: 16px 0;
      }
      .full-guide svg {
        width: 16px;
        height: 16px;
      }
      .map-error {
        position: absolute;
        left: 355px;
        right: 80px;
        top: 75px;
        padding: 14px 18px;
        border-radius: 16px;
        z-index: 2;
        background: #fff;
        color: #666;
        font-size: 13px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (min-width: 1100px) {
        .sidebar {
          width: 344px;
        }
        .map-heading {
          left: 384px;
        }
        .map-badge {
          left: calc(50% + 160px);
        }
      }
      @media (max-width: 760px) {
        .app {
          height: 710px;
        }
        .sidebar {
          width: 290px;
          left: 12px;
          top: 12px;
          bottom: 25px;
          border-radius: 23px;
        }
        .title-row h1 {
          font-size: 23px;
        }
        .side-head {
          padding-left: 16px;
          padding-right: 16px;
        }
        .map-heading {
          left: 322px;
          right: 70px;
          top: 24px;
        }
        .map-heading span {
          font-size: 13px;
        }
        .map-tools {
          right: 12px;
          top: 12px;
        }
        .map-badge {
          left: calc(50% + 135px);
          font-size: 12px;
          padding: 9px 12px;
        }
        .place-name {
          font-size: 15px;
        }
        .place {
          gap: 10px;
        }
        .place .place-icon {
          width: 38px;
          height: 38px;
        }
        .place:after {
          left: 58px;
        }
        .segments button {
          font-size: 11px;
          padding: 6px;
        }
        .list-head h2 {
          font-size: 18px;
        }
        .map-error {
          left: 316px;
          right: 70px;
        }
      }
      @media (max-width: 580px) {
        .app {
          height: 780px;
        }
        .sidebar {
          left: 10px;
          right: 10px;
          top: auto;
          bottom: 24px;
          width: auto;
          height: 405px;
          border-radius: 25px;
        }
        .sidebar.closed {
          transform: translateY(460px);
        }
        .side-head {
          padding-top: 10px;
        }
        .subtitle {
          display: none;
        }
        .title-row h1 {
          font-size: 22px;
        }
        .title-row {
          margin-bottom: 7px;
        }
        .segments {
          margin-top: 10px;
        }
        .list-head {
          padding-top: 15px;
        }
        .list-head h2 {
          font-size: 17px;
        }
        .side-foot {
          display: none;
        }
        .place {
          min-height: 82px;
          padding: 12px 10px;
        }
        .map-heading {
          left: 20px;
          right: 80px;
          top: 25px;
        }
        .map-heading span {
          font-size: 16px;
        }
        .map-badge {
          display: none;
        }
        .detail-name {
          font-size: 25px;
          margin-top: 10px;
        }
        .detail-toolbar {
          padding-top: 4px;
        }
        .sidebar:has(.detail:not([hidden])) {
          height: 465px;
        }
        .detail-section {
          margin-top: 20px;
        }
        .map-error {
          left: 18px;
          right: 80px;
        }
        .restore {
          top: auto;
          bottom: 28px;
          left: 18px;
        }
        .restore:not([hidden]) ~ .map-heading {
          left: 20px;
        }
        .pin-label {
          font-size: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass {
          background: #f6f6f8;
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
        .pin-label {
          background: white;
        }
      }
      @media (prefers-contrast: more) {
        .glass {
          background: #f7f7f9;
          border-color: #777;
        }
        .place-meta,
        .count,
        .subtitle,
        .place-rating {
          color: #42424b;
        }
      }
    </style>
  </head>

          <circle cx="10.8" cy="10.8" r="6.8" />

          maps: "https://www.google.com/maps/search/?api=1&query=Sakura+Ramen+Budapest+Kir%C3%A1ly+utca+12&query_place_id=ChIJZaqNDGrcQUcR7PIBBrp9Xck",
        },
        {
          id: "dimsum-wok-arkad",
          name: "DimSum & Wok go - Árkád",
          address: "1106 Budapest, Örs vezér tere 25/a.",
          district: "X",
          lat: 47.502842,
          lng: 19.139091,
          styles: [],
          vegan: false,
          rec: false,
          rating: 2.1,
          reviews: 200,
          price: null,
          menu: "https://wolt.com/en/hun/budapest/restaurant/dimsumwokgoarkad",
          maps: "https://www.google.com/maps/place/DimSum+%26+Wok+Go/@47.502842,19.139091,17z/data=!3m1!4b1!4m6!3m5!1s0x4741ddc12d1c7175:0x993df1ce0eb98dcf!8m2!3d47.502842!4d19.139091!16s%2Fg%2F11sv6w51gx?entry=ttu&g_ep=EgoyMDI2MDkyMy4wIKXMDSoASAFQAw%3D%3D",
        },
        {
          id: "bambuszliget",
          name: "Bambuszliget Japán Étterem & Sushi Bár",
          address: "1056 Budapest, Belgrád rakpart 18.",
          district: "V",
          lat: 47.4892645,
          lng: 19.0538666,
          styles: ["Miso"],
          vegan: false,
          rec: false,
          rating: null,
          reviews: null,
          price: null,
          menu: "https://bambuszliget.emenu.hu/Bambuszliget/Levesek535.html",
          maps: "https://maps.google.com/?q=47.4892645,19.0538666",
        },
        {
          id: "wafu-biangarden",
          name: "WAFU Ramen and Sushi Stand - Biangarden",
          address: "1107 Budapest, Szállás u. 21b",
          district: "X",
          lat: 47.4814898,
          lng: 19.1200438,
          styles: ["Shoyu"],
          vegan: false,
          rec: false,
          rating: null,
          reviews: null,
          price: null,
          menu: "https://wolt.com/en/hun/budapest/restaurant/wafu-ramen-and-sushi-stand-biengarden",
          maps: "https://www.google.com/maps/search/?api=1&query=Wafu+Sushi+Stand+Biangarden&query_place_id=ChIJRS1vXADdQUcR39-ni-1UjOg",
        },
        {
          id: "hachi",
          name: "HACHI Budapest",
          address: "1051 Budapest, Október 6. utca 9. (temporary pop-up)",
          district: "V",
          lat: 47.500699,
          lng: 19.0511419,
          styles: ["Tonkotsu", "Miso", "Shoyu", "Tantanmen"],
          vegan: false,
          rec: false,
          rating: null,
          reviews: null,
          price: { min: 5480, max: 6980, currency: "HUF", checkedOn: "2026-09-27" },
          menu: "https://www.instagram.com/stories/highlights/18030367751462924/",
          maps: "https://www.google.com/maps/search/?api=1&query=HACHI+Budapest+Budapest+Okt%C3%B3ber+6.+utca+8&query_place_id=ChIJdy81MXbdQUcR8lkJzqmk6Uo",
        },
      ];
      const $ = (id) => document.getElementById(id);
      const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const escapeHtml = (text) =>
        String(text).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const shortName = (p) =>
        p.name.replace(" Sake & Ramen Bar", "").replace(" Ramen Izakaya", "");
      const street = (p) => p.address.replace(/^\d{4}\s+Budapest,?\s*/, "");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const narrow = () => $("ramen-app").clientWidth <= 580;
      let filter = "all",
        query = "",
        selected = null,
        map,
        ready = false;
      const markers = new Map();
      let visiblePlaces = places;
      function announce(text) {
        $("announcements").textContent = text;
      }
      function getPadding() {
        return narrow()
          ? {
              top: 65,
              right: 55,
              bottom: $("sidebar").classList.contains("closed") ? 75 : selected ? 500 : 450,
              left: 30,
            }
          : {
              top: 75,
              right: 90,
              bottom: 90,
              left: $("sidebar").classList.contains("closed") ? 60 : $("sidebar").offsetWidth + 65,
            };
      }
      function framePlaces() {
        if (!map || !visiblePlaces.length) return;
        map.setPadding(getPadding());
        const bounds = new maplibregl.LngLatBounds();
        visiblePlaces.forEach((p) => bounds.extend([p.lng, p.lat]));
        map.fitBounds(bounds, {
          padding: 16,
          maxZoom: 14.4,
          duration: reducedMotion ? 0 : 400,
        });
      }
      function makeRows() {
        const normalized = query
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
        visiblePlaces = places.filter(
          (p) =>
            (filter !== "recommended" || p.rec) &&
            (filter !== "vegan" || p.vegan) &&
            [p.name, p.address, p.district, ...p.styles]
              .join(" ")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .includes(normalized),
        );
        $("count").textContent = `${visiblePlaces.length} places`;
        $("map-count").textContent = `${visiblePlaces.length} ramen places`;
        $("list-title").textContent = query
          ? "Search results"
          : filter === "recommended"
            ? "Recommended"
            : filter === "vegan"
              ? "Vegan ramen"
              : "Explore Budapest";
        $("clear-search").hidden = !query;
        $("list").replaceChildren();
        let addedOther = false;
        visiblePlaces.forEach((p) => {
          if (filter === "all" && !query && !p.rec && !addedOther) {
            const h = document.createElement("h3");
            h.className = "section-label";
            h.textContent = "More places";
            $("list").append(h);
            addedOther = true;
          }
          const button = document.createElement("button");
          button.className = "place";
          button.dataset.id = p.id;
          button.innerHTML = `<span class="place-icon">${icon("bowl")}</span><span class="place-body"><span class="place-name">${escapeHtml(shortName(p))}</span><span class="place-meta">${escapeHtml(street(p))}</span><span class="place-rating">${p.rating ? `${icon("star")}<b>${p.rating.toFixed(1)}</b><span>·</span>` : ""}<span>${p.vegan ? "Vegan options" : `District ${escapeHtml(p.district)}`}</span></span></span><svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg>`;
          button.addEventListener("click", () => selectPlace(p.id));
          $("list").append(button);
        });
        if (!visiblePlaces.length)
          $("list").innerHTML =
            '<div class="empty">No places found.<br>Try another name, style, or district.</div>';
        const ids = new Set(visiblePlaces.map((p) => p.id));
        markers.forEach((marker, id) => (marker.getElement().hidden = !ids.has(id)));
        announce(`${visiblePlaces.length} restaurants shown`);
      }
      function selectPlace(id) {
        const p = places.find((p) => p.id === id);
        if (!p) return;
        selected = id;
        $("sidebar").classList.remove("closed");
        $("sidebar").inert = false;
        $("show-sidebar").hidden = true;
        $("browse").hidden = true;
        $("detail").hidden = false;
        $("detail").innerHTML =
          `<div class="detail-toolbar"><button class="back" id="back">${icon("back")}Explore</button><button class="icon-button" id="close-detail" aria-label="Close restaurant details">${icon("close")}</button></div><div class="detail-scroll"><h2 class="detail-name" id="detail-title" tabindex="-1">${escapeHtml(p.name)}</h2><p class="detail-address">${escapeHtml(street(p))}<br>District ${escapeHtml(p.district)}, Budapest</p>${p.rec ? `<div class="recommendation">${icon("check")}Recommended by Budapest Ramen</div>` : ""}<div class="detail-stars">${p.rating ? `${icon("star")}<strong>${p.rating.toFixed(1)}</strong><span>· ${p.reviews.toLocaleString()} Google reviews</span>` : "Google rating unavailable"}</div><div class="actions"><a class="action primary" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${p.name} ${p.address}`)}" target="_blank" rel="noopener">${icon("location")}Directions</a><a class="action" href="${escapeHtml(p.menu || p.maps)}" target="_blank" rel="noopener">${icon("menu")}Menu</a></div><section class="detail-section"><h3>At a glance</h3><div class="grouped"><div class="info-row">${icon("bowl")}<div><small>Ramen styles</small><strong>${escapeHtml(p.styles.join(", "))}</strong></div></div>${p.vegan ? `<div class="info-row">${icon("leaf")}<div><strong>Vegan options available</strong></div></div>` : ""}${p.price ? `<div class="info-row">${icon("menu")}<div><small>Ramen price range</small><strong>${p.price.min.toLocaleString()} - ${p.price.max.toLocaleString()} Ft</strong></div></div>` : ""}</div></section><section class="detail-section"><h3>Address</h3><div class="grouped"><a class="info-row" href="${escapeHtml(p.maps)}" target="_blank" rel="noopener">${icon("pin")}<span>${escapeHtml(p.address)}</span></a></div></section><a class="full-guide" href="https://budapestramen.com/en/ramen-ya/${p.id}" target="_blank" rel="noopener">View full restaurant guide${icon("arrow")}</a><p class="detail-source">Restaurant information from the current Budapest Ramen guide.</p></div>`;
        $("back").addEventListener("click", closeDetail);
        $("close-detail").addEventListener("click", closeDetail);
        markers.forEach((m, key) => {
          m.getElement().classList.toggle("selected", key === id);
          m.getElement().setAttribute("aria-pressed", String(key === id));
        });
        if (map)
          map.easeTo({
            center: [p.lng, p.lat],
            zoom: 15.2,
            padding: { ...getPadding(), bottom: narrow() ? 490 : 100 },
            duration: reducedMotion ? 0 : 450,
          });
        $("detail-title").focus({ preventScroll: true });
        announce(`Showing ${p.name}`);
      }
      function closeDetail() {
        const previous = selected;
        selected = null;
        $("browse").hidden = false;
        $("detail").hidden = true;
        markers.forEach((m) => {
          m.getElement().classList.remove("selected");
          m.getElement().setAttribute("aria-pressed", "false");
        });
        $("list").querySelector(`[data-id="${previous}"]`)?.focus({ preventScroll: true });
        if (map) map.easeTo({ padding: getPadding(), duration: reducedMotion ? 0 : 250 });
      }
      $("search").addEventListener("input", (e) => {
        query = e.target.value;
        makeRows();
      });
      $("clear-search").addEventListener("click", () => {
        query = "";
        $("search").value = "";
        makeRows();
        $("search").focus();
      });
      document.querySelectorAll("[data-filter]").forEach((button) =>
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document
            .querySelectorAll("[data-filter]")
            .forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
          makeRows();
          framePlaces();
        }),
      );
      $("hide-sidebar").addEventListener("click", () => {
        $("sidebar").classList.add("closed");
        $("sidebar").inert = true;
        $("show-sidebar").hidden = false;
        $("show-sidebar").focus();
        if (map) map.easeTo({ padding: getPadding(), duration: reducedMotion ? 0 : 280 });
      });
      $("show-sidebar").addEventListener("click", () => {
        $("sidebar").classList.remove("closed");
        $("sidebar").inert = false;
        $("show-sidebar").hidden = true;
        $("hide-sidebar").focus();
        if (map) map.easeTo({ padding: getPadding(), duration: reducedMotion ? 0 : 280 });
      });
      $("fit-map").addEventListener("click", framePlaces);
      $("zoom-in").addEventListener("click", () =>
        map?.zoomIn({ duration: reducedMotion ? 0 : 250 }),
      );
      $("zoom-out").addEventListener("click", () =>
        map?.zoomOut({ duration: reducedMotion ? 0 : 250 }),
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && selected) closeDetail();
      });
      makeRows();
      try {
        map = new maplibregl.Map({
          container: "map",
          style: "https://tiles.openfreemap.org/styles/positron",
          center: [19.054, 47.498],
          zoom: 13.5,
          attributionControl: false,
          dragRotate: false,
          pitchWithRotate: false,
          cooperativeGestures: true,
        });
        map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
        map.touchZoomRotate.disableRotation();
        map.on("load", () => {
          ready = true;
          $("map-error").hidden = true;
          map.setPaintProperty("water", "fill-color", "#a5cce1");
          map.setPaintProperty("waterway", "line-color", "#a5cce1");
          map.setPaintProperty("park", "fill-color", "#d5e6c6");
          map.setPaintProperty("landcover_wood", "fill-color", "#d5e6c6");
          map.setPaintProperty("background", "background-color", "#f5f3ed");
          map.setPaintProperty("landuse_residential", "fill-color", "#eeeae3");
          map.setPaintProperty("building", "fill-color", "#e2dfd7");
          for (const p of places) {
            const element = document.createElement("button");
            element.className = `pin${p.rec ? " recommended" : ""}`;
            element.setAttribute("aria-label", p.name);
            element.setAttribute("aria-pressed", "false");
            element.innerHTML = `<span class="pin-core">${icon("bowl")}</span>${p.rec ? `<span class="pin-label">${escapeHtml(shortName(p))}</span>` : ""}`;
            element.addEventListener("click", () => selectPlace(p.id));
            markers.set(
              p.id,
              new maplibregl.Marker({ element }).setLngLat([p.lng, p.lat]).addTo(map),
            );
          }
          makeRows();
          map.setPadding(getPadding());
          const initial = new maplibregl.LngLatBounds();
          places.filter((p) => p.rec).forEach((p) => initial.extend([p.lng, p.lat]));
          map.fitBounds(initial, { padding: 24, maxZoom: 14.2, duration: 0 });
          map.once("idle", () => $("map").classList.add("ready"));
        });
        map.on("error", () => {
          if (!ready) $("map-error").hidden = false;
        });
        new ResizeObserver(() => {
          map.resize();
          map.setPadding(getPadding());
        }).observe($("ramen-app"));
      } catch (error) {
        $("map-error").hidden = false;
        console.error(error);
      }
      setTimeout(() => {
        if (!ready) $("map-error").hidden = false;
      }, 12000);
    </script>
  </body>
</html>
